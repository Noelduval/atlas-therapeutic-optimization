[project]
name = "atlas-therapeutic-optimization"
version = "0.1.0"
description = "Inspectable autonomous computational optimization for the VITA Aβ metalloprotease challenge."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=0.6,<2",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "rich>=14,<15",
  "streamlit>=1.48,<2",
  "typer>=0.16,<1",
]

[project.scripts]
atlas = "atlas.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
